name: CI Pipeline - Aplicacao Web

# 1. Gatilho: Executa o workflow sempre que houver um Pull Request para a branch main ou develop
on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      # Checkout do código fonte do repositório
      - name: Checkout do codigo
        uses: actions/checkout@v4

      # Configuração do ambiente (Exemplo usando Node.js para aplicação WEB)
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      # 2. Análise estática e de formatação (Linter e Formatador)
      - name: Executar Análise Estática (Linter)
        run: npm run lint

      # 3. Build da Aplicação WEB
      - name: Executar Build
        run: npm run build

      # 4. Testes Unitários e de Integração
      - name: Executar Testes
        run: npm test -- --coverage --watchAll=false

      # 5. Criar Imagem (Docker)
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub (Opcional para ambiente de PRs)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false # Em PRs, apenas construímos para validar; o push real costuma ocorrer na branch main (CD)
          tags: minha-aplicacao-web:${{ github.sha }}